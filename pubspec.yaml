name: bovino_vision_mobile
description: "BovinoVision - Aplicación móvil para captura y pesaje bovino conectada a la API de BovinoVision."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Spanish texts for Material widgets such as the date picker
  flutter_localizations:
    sdk: flutter

  # UI e Íconos
  cupertino_icons: ^1.0.8

  # Navegación y Enrutamiento Declarativo
  go_router: ^14.2.0

  # Gestión de Estado
  provider: ^6.1.2

  # Persistencia de la sesión en el almacenamiento privado de la app
  path_provider: ^2.1.3

  # Conectividad y Red
  connectivity_plus: ^6.0.3
  http: ^1.6.0

  # Captura de fotos (cámara del sistema y galería)
  image_picker: ^1.2.4

  # Utilidades
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
