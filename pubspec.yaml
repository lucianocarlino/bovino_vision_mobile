name: bovino_vision_mobile
description: "MVP BovinoVision - Aplicación móvil offline-first para captura y pesaje bovino."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # UI e Íconos
  cupertino_icons: ^1.0.8

  # Navegación y Enrutamiento Declarativo
  go_router: ^14.2.0

  # Gestión de Estado
  provider: ^6.1.2

  # Persistencia Local (SQLite Offline-first)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Conectividad y Red
  connectivity_plus: ^6.0.3

  # Hardware de Captura
  camera: ^0.11.0+1

  # Utilidades
  intl: ^0.19.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
